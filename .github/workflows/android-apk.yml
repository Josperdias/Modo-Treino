name: Android - APK de teste
# Gera um APK STANDALONE (JavaScript embutido) para instalar em aparelhos Android de teste.
# - Pull request / manual: gera o artefato "modo-treino-android-apk" (30 dias).
# - Tag v* ou execução manual com "publicar" marcado: também cria uma pré-release com o APK e o SHA-256.
# Assinatura: se os secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD
# existem, o APK é assinado com a chave própria do projeto (permite atualizar por cima de uma versão anterior).
# Sem eles (ex.: PR de fork) cai na chave de DEPURAÇÃO do template Expo. Nenhuma das duas serve para Play Store sem revisão.
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar como pré-release no GitHub (tag v<versão do app.json>)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'native/**'
      - 'shared/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sign: ${{ steps.meta.outputs.sign }}
      cert: ${{ steps.meta.outputs.cert }}
      apk: ${{ steps.meta.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # O runner ubuntu-latest já traz o Android SDK em $ANDROID_HOME. (A action android-actions/setup-android@v3
      # falhava com "Failed to find package 'tools'" nas versões atuais do sdkmanager.)
      - name: Android SDK (licenças e componentes)
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          echo "ANDROID_HOME=$ANDROID_HOME  sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Dependências JavaScript
        working-directory: native
        run: npm ci --no-audit --no-fund
      - name: Typecheck antes de gastar tempo no Gradle
        working-directory: native
        run: npx tsc --noEmit
      - name: Gerar o projeto Android a partir do Expo
        working-directory: native
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - name: Chave de assinatura (se os secrets existirem)
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KS_KEYPASS" ]; then
            # Segredos colados à mão costumam vir com espaço ou quebra de linha no fim: tira antes de usar.
            trim() { printf '%s' "$1" | tr -d '[:space:]'; }
            export KS_PASS="$(trim "$KS_PASS")" KS_ALIAS="$(trim "$KS_ALIAS")" KS_KEYPASS="$(trim "$KS_KEYPASS")"
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/modo-treino.jks"
            # Confere a chave em segundos (sem imprimir nada secreto), em vez de descobrir só depois de 6 min de Gradle.
            if ! keytool -list -keystore "$RUNNER_TEMP/modo-treino.jks" -storepass:env KS_PASS > /dev/null 2>&1; then
              echo "::error::A senha do keystore (ANDROID_KEYSTORE_PASSWORD) não abre o arquivo do ANDROID_KEYSTORE_BASE64. Recadastre os dois secrets a partir do mesmo keystore."; exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/modo-treino.jks" -storepass:env KS_PASS -alias "$KS_ALIAS" > /dev/null 2>&1; then
              echo "::error::O alias (ANDROID_KEY_ALIAS) não existe nesse keystore."; exit 1
            fi
            cp "$RUNNER_TEMP/modo-treino.jks" "$RUNNER_TEMP/teste-chave.jks"
            if ! keytool -keypasswd -keystore "$RUNNER_TEMP/teste-chave.jks" -storepass:env KS_PASS -alias "$KS_ALIAS" -keypass:env KS_KEYPASS -new:env KS_KEYPASS > /dev/null 2>&1; then
              echo "::error::A senha da chave (ANDROID_KEY_PASSWORD) não confere com o alias."; exit 1
            fi
            rm -f "$RUNNER_TEMP/teste-chave.jks"
            echo "MT_KEYSTORE_FILE=$RUNNER_TEMP/modo-treino.jks" >> "$GITHUB_ENV"
            echo "mode=propria" >> "$GITHUB_OUTPUT"
            echo "Assinatura: chave própria do projeto (keystore, alias e senhas conferidos)."
          else
            echo "mode=teste" >> "$GITHUB_OUTPUT"
            echo "Assinatura: chave de teste do template (secrets ausentes)."
          fi
      - name: Compilar (release, arm64 + armeabi-v7a)
        working-directory: native/android
        env:
          MT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # mesmos valores já conferidos acima, sem espaços/quebras de linha
          for v in MT_KEYSTORE_PASSWORD MT_KEY_ALIAS MT_KEY_PASSWORD; do export "$v=$(printf '%s' "${!v}" | tr -d '[:space:]')"; done
          node ../../scripts/assinar-android.mjs app/build.gradle
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Conferir, nomear e calcular SHA-256
        id: meta
        env:
          SIGN_MODE: ${{ steps.sign.outputs.mode }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./native/app.json').expo.version")
          SRC=$(ls native/android/app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p dist
          OUT="dist/modo-treino-${VERSION}-teste.apk"
          cp "$SRC" "$OUT"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "== Assinatura (apksigner) =="
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee dist/assinatura.txt
          echo "== Pacote e versão (aapt2) =="
          "$BT/aapt2" dump badging "$OUT" | grep -E "^package:|^sdkVersion|^targetSdkVersion|application-label:" | tee dist/badging.txt
          grep -q "name='art.josperd.modotreino'" dist/badging.txt
          grep -q "versionName='${VERSION}'" dist/badging.txt
          if [ "$SIGN_MODE" = propria ]; then
            grep -q "certificate DN: CN=Modo Treino" dist/assinatura.txt || { echo "::error::APK não foi assinado com a chave própria (CN=Modo Treino)"; exit 1; }
          fi
          unzip -l "$OUT" | grep -E "classes.dex|assets/index.android.bundle|AndroidManifest.xml"
          unzip -l "$OUT" | grep -q "assets/index.android.bundle" || { echo "::error::APK sem bundle JS embutido (não seria standalone)"; exit 1; }
          (cd dist && sha256sum "modo-treino-${VERSION}-teste.apk" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          SHA=$(cut -d' ' -f1 dist/SHA256SUMS.txt)
          SIZE=$(stat -c%s "$OUT")
          CERT=$(grep -m1 "certificate SHA-256 digest" dist/assinatura.txt | awk '{print $NF}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=modo-treino-${VERSION}-teste.apk" >> "$GITHUB_OUTPUT"
          echo "sign=$SIGN_MODE" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          {
            echo "## APK de teste — Modo Treino ${VERSION}"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Arquivo | \`modo-treino-${VERSION}-teste.apk\` |"
            echo "| Tamanho | $((SIZE/1024/1024)) MB |"
            echo "| SHA-256 | \`${SHA}\` |"
            echo "| Assinatura (SHA-256 do certificado) | \`${CERT}\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Data (UTC) | $(date -u +'%Y-%m-%d %H:%M') |"
            echo "| ABIs | arm64-v8a, armeabi-v7a (aparelhos físicos; não roda em emulador x86) |"
            echo ""
            if [ "$SIGN_MODE" = propria ]; then echo "Assinado com a **chave própria** do projeto (mesma chave em todas as versões: atualiza por cima)."; else echo "Assinado com a chave de depuração do template Expo: **somente teste**."; fi
            echo "Não é build de produção da Play Store."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: modo-treino-android-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/assinatura.txt
            dist/badging.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar pré-release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modo-treino-android-apk
          path: dist
      - name: Montar texto da release
        id: notes
        run: |
          SHA=$(cut -d' ' -f1 dist/SHA256SUMS.txt)
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v${{ needs.apk.outputs.version }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "APK de **teste** do Modo Treino ${{ needs.apk.outputs.version }}, para avaliação em aparelhos Android. Não é a versão da Play Store."
            echo ""
            echo "**SHA-256:** \`${SHA}\`"
            echo ""
            echo "### Como instalar"
            echo "1. Baixe \`${{ needs.apk.outputs.apk }}\` no próprio celular."
            echo "2. Abra o arquivo e permita instalar de \"fonte desconhecida\" só para esta instalação."
            echo "3. Confira o SHA-256 acima com \`sha256sum\` (Linux/Mac) ou \`certutil -hashfile arquivo SHA256\` (Windows)."
            echo ""
            if [ "${{ needs.apk.outputs.sign }}" = propria ]; then
              echo "**Assinatura:** chave própria do projeto (SHA-256 do certificado: \`${{ needs.apk.outputs.cert }}\`). Versões futuras com a mesma chave atualizam por cima."
              echo ""
              echo "> Se você instalou antes uma versão assinada com a chave de teste (1.1.1 ou anterior), o Android recusa a atualização: exporte o backup em Ajustes, desinstale e instale esta."
              echo ""
            fi
            echo "Seus treinos e músicas ficam só no aparelho. Exporte um backup (Ajustes) antes de trocar de versão."
            echo "O app avisa quando houver release nova, mas **nunca instala sozinho**."
          } > notes.md
      - name: Criar pré-release com APK e SHA-256
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          # sem isto a tag nova nasceria no HEAD da branch padrão, não no commit que gerou o APK
          target_commitish: ${{ github.sha }}
          name: Modo Treino ${{ needs.apk.outputs.version }} (APK de teste)
          body_path: notes.md
          files: |
            dist/${{ needs.apk.outputs.apk }}
            dist/SHA256SUMS.txt
          draft: false
          prerelease: true
