name: Site (GitHub Pages)
# Publica a pasta site/ (PWA + página /baixar/ com o download do APK).
# Pré-requisito único: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'shared/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Publicar site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Só publica se a estrutura e a lógica passam
        run: |
          python3 tests/verify.py
          node scripts/sync-shared.mjs --check
          node --test "tests/*.test.mjs"
      # Se falhar aqui com "Get Pages site failed", o Pages ainda não foi ligado: Settings → Pages → Source: GitHub Actions.
      # (O parâmetro `enablement: true` NÃO funciona com o GITHUB_TOKEN padrão: "Resource not accessible by integration".)
      - uses: actions/configure-pages@v5
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Conferir que o site está no ar (HTTP 200 e conteúdo certo)
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Site: $URL"
          check() { for i in 1 2 3 4 5 6 7 8; do code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$1"); if [ "$code" = 200 ] && grep -q "$2" /tmp/page.html; then echo "ok $1"; return 0; fi; echo "tentativa $i: HTTP $code"; sleep 10; done; return 1; }
          check "$URL" "Modo Treino"
          check "${URL}baixar/" "NO BOLSO"
          {
            echo "## Site publicado"
            echo ""
            echo "- Site: $URL"
            echo "- Download do app: ${URL}baixar/"
          } >> "$GITHUB_STEP_SUMMARY"
